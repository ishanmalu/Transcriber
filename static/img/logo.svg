<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Transcriber">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e08a5f"/>
      <stop offset="1" stop-color="#c25b34"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g)"/>
  <g fill="#fff">
    <!-- waveform: sound going in -->
    <g>
      <rect x="118" y="176" width="26" height="60"  rx="13"/>
      <rect x="166" y="144" width="26" height="124" rx="13"/>
      <rect x="214" y="112" width="26" height="188" rx="13"/>
      <rect x="262" y="150" width="26" height="112" rx="13"/>
      <rect x="310" y="128" width="26" height="156" rx="13"/>
      <rect x="358" y="172" width="26" height="68"  rx="13"/>
    </g>
    <!-- lines of text coming out -->
    <g opacity=".95">
      <rect x="118" y="342" width="266" height="26" rx="13"/>
      <rect x="118" y="396" width="186" height="26" rx="13"/>
    </g>
  </g>
</svg>
